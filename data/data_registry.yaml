version: "1.0"
datasets:
  - id: "roboflow_tennis_ball_v6"
    name: "Tennis Ball Detection Dataset"
    version: "v6"
    url: "https://universe.roboflow.com/viren-dhanwani/tennis-ball-detection/dataset/6"
    source: "Roboflow Universe (viren-dhanwani)"
    license: "CC BY 4.0"
    citation: "Dhanwani, V. (2023). Tennis Ball Detection. Roboflow Universe."
    task: "object_detection"
    classes: ["tennis-ball"]
    image_count: 578
    splits:
      train: 428
      val: 100
      test: 50
    annotation_format: "yolo_txt"
    court_surfaces: ["hard", "clay"]
    camera_views: ["elevated_baseline", "baseline"]
    resolution: "variable (standard broadcast/amateur)"
    leakage_status: "UNVERIFIED (individual images; intra-video leakage possible)"
    decision: "APPROVED"
    intended_use: "YOLO11m tennis ball detector baseline fine-tuning"

  - id: "yastrebksv_court_keypoints"
    name: "Tennis Court Keypoint Dataset"
    version: "v1"
    url: "https://github.com/yastrebksv/TennisCourtDetector"
    mirror_url: "https://huggingface.co/datasets/Gholamreza/tennis_court_keypoints_dataset"
    source: "yastrebksv / HuggingFace mirror"
    license: "NO_EXPLICIT_LICENSE (Academic baseline use)"
    citation: "yastrebksv (2023). TennisCourtDetector. GitHub repository."
    task: "keypoint_regression"
    keypoints_count: 14
    image_count: 8841
    splits:
      train: 6630
      val: 2211
      test: 0
    annotation_format: "json_coordinates"
    court_surfaces: ["hard", "clay", "grass"]
    camera_views: ["broadcast_baseline"]
    resolution: "1280x720"
    leakage_status: "LIKELY (broadcast frames sampled across matches)"
    decision: "APPROVED"
    intended_use: "ResNet-50 14-point court coordinate regression baseline"

  - id: "tutorial_sample_clip"
    name: "Tutorial Baseline Sample Video"
    version: "v1"
    url: "https://github.com/abdullahtarek/tennis_analysis/raw/main/input_videos/input_video.mp4"
    source: "abdullahtarek/tennis_analysis"
    license: "UNLICENSED (Research/Benchmarking reproduction only)"
    task: "video_inference_evaluation"
    duration_seconds: 7.13
    fps: 30.0
    resolution: "1920x1080"
  - id: "tennis_events_benchmark"
    name: "Development / Calibration Tennis Match Events Benchmark"
    version: "v1"
    url: "local:data/benchmarks/tennis_events/ground_truth.json"
    source: "T88J709 Project Trajectory Export"
    license: "Proprietary FYP Research Benchmark"
    task: "tennis_event_development_calibration"
    events_count: 6
    classes: ["SERVE_CONTACT", "BOUNCE", "PLAYER_1_HIT", "PLAYER_2_HIT"]
    status: "DEVELOPMENT_CALIBRATION_BENCHMARK"
    intended_use: "Calibration and debugging of kinematic derivative filters"

  - id: "tennis_events_independent"
    name: "Independent Ground Truth Tennis Match Events Benchmark"
    version: "v1"
    url: "local:data/benchmarks/tennis_events_independent/ground_truth.json"
    source: "Manual Frame-by-Frame Visual Inspection of Raw MP4 Video"
    license: "Proprietary FYP Research Benchmark"
    task: "independent_event_and_localization_evaluation"
    events_count: 7
    classes: ["SERVE_CONTACT", "BOUNCE", "PLAYER_1_HIT", "PLAYER_2_HIT", "POINT_END"]
    status: "INDEPENDENT_EVALUATION_BENCHMARK"
  - id: "shot_classification_real"
    name: "Independent Real-World Multi-Rally Tennis Shot Benchmark (V1 Development Archive)"
    version: "v1"
    url: "local:data/benchmarks/shot_classification_real/real_rallies_ground_truth.json"
    source: "Manual Frame-by-Frame Visual Inspection across 8 Match Rallies"
    license: "Proprietary FYP Research Benchmark"
    task: "stroke_classification_and_rally_analytics_evaluation"
    strokes_count: 36
    rallies_count: 8
    classes: ["FOREHAND", "BACKHAND", "SERVE", "UNKNOWN"]
    status: "DEVELOPMENT_BENCHMARK_ARCHIVE"
    intended_use: "Feature development & baseline validation."

  - id: "shot_classification_real_v2"
    name: "Independent Real-World Multi-Video Tennis Shot Benchmark (V2 Production)"
    version: "v2"
    url: "local:data/benchmarks/shot_classification_real_v2/ground_truth.json"
    source: "Manual Frame-by-Frame Visual Inspection of 5 Physical MP4 Match Videos"
    license: "CC BY-SA 4.0 / Academic Research"
    task: "physical_media_end_to_end_shot_and_rally_evaluation"
    strokes_count: 26
    rallies_count: 5
    video_sources_count: 5
    classes: ["FOREHAND", "BACKHAND", "SERVE", "UNKNOWN"]
    status: "DIAGNOSTIC_BENCHMARK"
    intended_use: "Empirical evaluation of production CV pipeline on diagnostic video-source partitions."

  - id: "cross_match_diagnostic_legacy_path"
    name: "Cross-Match Diagnostic Tennis Benchmark"
    version: "v1.0"
    url: "https://commons.wikimedia.org"
    source: "Wikimedia Commons (US Open Championships)"
    license: "CC BY-SA 2.0 / CC BY-SA 4.0"
    task: "end_to_end_cross_match_diagnostic_development"
    video_count: 3
    frame_count: 2672
    strokes_count: 20
    rallies_count: 3
    video_sources_count: 3
    classes: ["FOREHAND", "BACKHAND", "SERVE"]
    status: "CROSS_MATCH_DIAGNOSTIC"
    intended_use: "Development, error analysis, ablation, threshold calibration, and regression testing only."
    scientific_history: "Originally intended as a final holdout; reclassified after outputs were inspected and used for post-freeze debugging/tuning."
    legacy_path: "data/benchmarks/cross_match_final_holdout"
    qualification_evidence: false

models:
  - id: "yolo11s_tennis_ball_best"
    architecture: "Ultralytics YOLO11s"
    path: "artifacts/models/ball/yolo11s_tennis_ball_best.pt"
    task: "tennis_ball_detection"
    dataset: "roboflow_tennis_ball_v6"
    test_metrics:
      precision: 0.8843
      recall: 0.8000
      map50: 0.8594
      map50_95: 0.3839
    status: "PRODUCTION_PHASE2"

  - id: "yolo11m_player_detector"
    architecture: "Ultralytics YOLO11m"
    path: "yolo11m.pt"
    task: "player_detection_and_tracking"
    status: "PRODUCTION_PLAYERS"

  - id: "yolo11n_pose_detector"
    architecture: "Ultralytics YOLO11n-Pose"
    path: "yolo11n-pose.pt"
    task: "player_keypoint_and_stroke_kinematics"
    status: "PRODUCTION_PHASE6_1"

  - id: "resnet50_court_keypoints"
    architecture: "ResNet-50 14-Keypoint Regressor"
    path: "models/keypoints_model.pth"
    task: "court_keypoint_detection"
    status: "PRODUCTION_COURT"

  - id: "yolo5_last_legacy"
    architecture: "YOLOv5l6u"
    path: "models/yolo5_last.pt"
    task: "tennis_ball_detection"
    status: "LEGACY_ARCHIVED_DO_NOT_USE_IN_PRODUCTION"
