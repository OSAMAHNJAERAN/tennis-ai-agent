# Selected three-model candidate. Never qualified by configuration alone.
# Historical configs remain available for reproducibility; no automatic fallback.
match_configuration:
  match_id: match_phase6_001
  format: BEST_OF_3
  set_format: TIE_BREAK_SET
  player_1_id: 1
  player_2_id: 2
  initial_server_id: 2
player_detection:
  model: models/yolo26/yolo26s-pose.pt
  imgsz: 960
  confidence: 0.4
  tracker: configs/production/botsort_no_reid.yaml
ball_detection:
  backend: yolo26
  model: models/yolo26/ball_best.pt
  imgsz: 1280
  high_conf: 0.25
  low_conf: 0.05
  class_id: 0
  tiles:
    enabled: false
    size_px: 960
    overlap: 0.2
    dedup_iou: 0.5
    dedup_center_px: 2.0
temporal_tracking:
  max_prediction_gap: 4
  max_interpolation_gap: 3
  max_valid_speed_px_per_frame: 80.0
  base_gating_radius_px: 45.0
  enable_multi_candidate_association: true
  enable_adaptive_gate: true
  enable_short_gap_reacquisition: true
  enable_camera_motion_compensation: false
  enable_scale_normalization: true
  enable_frame_bounds_filter: true
court_detection:
  model_path: models/yolo26/court_best.pt
  imgsz: 1280
  confidence: 0.4
  keypoint_confidence: 0.5
  landmark_schema: tennis_court_14_v1
event_detection:
  enable_camera_motion_compensation: true
  enable_player_temporal_proximity: true
  enable_velocity_discontinuity: true
  enable_direction_change: true
  enable_pose_support: false
  enable_bounce_contact_check: true
  enable_dead_ball_gating: true
  enable_serve_semantics: true
  enable_event_time_refinement: true
  enable_provenance_weighting: true
  feature_half_window_seconds: 0.067
  candidate_min_interval_seconds: 0.12
  candidate_score_threshold: 0.33
  candidate_min_normalized_speed_per_s: 0.05
  candidate_min_direction_change_deg: 14.0
  candidate_min_normalized_velocity_change_per_s: 0.045
  candidate_min_normalized_acceleration_per_s2: 0.4
  candidate_min_normalized_vertical_speed_per_s: 0.018
  candidate_min_continuity_ratio: 0.6
  max_normalized_edge_speed_per_s: 3.0
  temporal_proximity_window_seconds: 0.14
  event_time_refinement_window_seconds: 0.12
  player_reach_normalized: 1.35
  player_attribution_margin_normalized: 0.15
  racket_region_top_normalized: -0.35
  racket_region_bottom_normalized: 0.85
  player_contact_min_score: 0.47
  player_contact_min_independent_cues: 3
  court_contact_min_score: 0.44
  court_contact_min_independent_cues: 3
  physical_type_margin: 0.05
  departure_window_seconds: 0.12
  serve_evidence_window_seconds: 0.4
  serve_min_score: 0.58
  serve_overhead_y_normalized: 0.48
  serve_min_post_speed_normalized_per_s: 0.075
  serve_min_departure_speed_gain: 1.05
  final_event_min_interval_seconds: 0.18
  rolling_max_normalized_speed_per_s: 0.03
  dead_ball_min_kinematic_support: 0.2
  authoritative_enabled: false
line_calling:
  contact_patch_model: EMPIRICAL_PATCH
  contact_patch_radius_cm: 1.25
  uncertainty_safety_factor: 1.5
  line_width_uncertainty_cm: 1.25
  contact_refinement_window: 3
pose_estimation:
  enabled: true
  source: player_model
  min_pose_confidence: 0.35
  window_half_size: 3
  crop_margin: 0.25
shot_classification:
  ambiguity_threshold: 0.15
  players_handedness: {}
  court_orientation_sign: {}
visualization:
  landing_zones:
    enabled: true
    partition: tactical_3x3
    duration_seconds: 0.8
  draw_trajectories: true
  draw_court_lines: true
  draw_player_boxes: true
  draw_shot_badges: true
  mini_court_width: 250
  mini_court_height: 500
model_system:
  family: yolo26
  vision_model_count: 3
  ultralytics_version: 8.4.36
  artifact_manifest: configs/production/yolo26.artifacts.json
  device: auto
  inference_head: one_to_one
  end2end: true
  nms: false
  status: UNQUALIFIED_MISSING_SPECIALIST_CHECKPOINTS
player_motion:
  enabled: true
