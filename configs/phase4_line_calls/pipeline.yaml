# Phase 4 Configuration: Assisted Tennis IN/OUT Line-Calling Engine & Spatial Uncertainty

player_detection:
  model: "yolo11m.pt"
  confidence: 0.40
  tracker: "bytetrack.yaml"

ball_detection:
  model: "artifacts/models/ball/yolo11s_tennis_ball_best.pt"
  imgsz: 640
  high_conf: 0.25
  low_conf: 0.05

temporal_tracking:
  max_prediction_gap: 3
  max_interpolation_gap: 3
  max_valid_speed_px_per_frame: 60.0
  base_gating_radius_px: 40.0

court_detection:
  model: "models/keypoints_model.pth"
  input_size: [224, 224]

event_detection:
  min_event_interval: 10
  player_reach_radius_px: 140.0
  min_hit_deflection_deg: 40.0
  min_bounce_curvature: 0.005

line_calling:
  contact_patch_model: "EMPIRICAL_PATCH"
  contact_patch_radius_cm: 1.25
  line_width_uncertainty_cm: 1.25
  uncertainty_safety_factor: 1.5
  contact_refinement_window: 3

visualization:
  mini_court_width: 250
  mini_court_height: 500
  draw_trajectory: true
  trajectory_length: 25
  show_legend: true
  show_line_call_banner: true

output:
  save_annotated_video: true
  save_json: true
  video_codec: "mp4v"
