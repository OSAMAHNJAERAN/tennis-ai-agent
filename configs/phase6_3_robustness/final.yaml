# Phase 6.3 Production Configuration: Real-World Ball Tracking & Tennis Event Robustness
# Frozen for Independent Evaluation and Benchmark Execution

version: "6.3.0"
date_frozen: "2026-08-22"

match_configuration:
  match_id: "match_phase6_3_production"
  format: "BEST_OF_3"
  set_format: "TIE_BREAK_SET"
  player_1_id: 1
  player_2_id: 2
  initial_server_id: 2

player_detection:
  model: "yolo11m.pt"
  confidence: 0.40
  tracker: "bytetrack.yaml"
  court_adaptive_assignment: true

ball_detection:
  model: "artifacts/models/ball/yolo11s_tennis_ball_best.pt"
  imgsz: 1024
  high_conf: 0.08
  low_conf: 0.01

temporal_tracking:
  max_prediction_gap: 4
  max_interpolation_gap: 3
  max_valid_speed_px_per_frame: 80.0
  base_gating_radius_px: 45.0
  confidence_decay_per_frame: 0.20
  backward_confirmation_pass: true

court_detection:
  model_path: "models/keypoints_model.pth"
  input_size: [224, 224]

event_detection:
  min_event_interval: 10
  player_reach_radius_px: 160.0
  min_hit_deflection_deg: 30.0
  min_bounce_curvature: 0.002
  candidate_score_threshold: 22.0

line_calling:
  contact_patch_model: "EMPIRICAL_PATCH"
  contact_patch_radius_cm: 1.25
  uncertainty_safety_factor: 1.5
  line_width_uncertainty_cm: 1.25
  contact_refinement_window: 3

pose_estimation:
  enabled: true
  model_path: "yolo11n-pose.pt"
  min_pose_confidence: 0.35
  window_half_size: 2
  crop_margin: 0.25

shot_classification:
  ambiguity_threshold: 0.15
  players_handedness:
    1: "RIGHT_HANDED"
    2: "RIGHT_HANDED"

visualization:
  draw_trajectories: true
  draw_court_lines: true
  draw_player_hud: true
  draw_speed_vectors: true
